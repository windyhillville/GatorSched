[project]
name = "gatorsched-api"
version = "0.1.0"
description = "Backend API for GatorSched"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # errors, pyflakes, import sort, bugbear, pyupgrade
ignore = ["E501"]  # let formatter handle line-length
[tool.ruff.lint.per-file-ignores]
"gatorsched_api/api/**.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"